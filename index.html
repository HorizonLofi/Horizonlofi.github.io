<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Punk</title>

    <!-- Open Graph -->
    <meta property="og:title" content="404 Punk" />
    <meta property="og:description" content="404 signal detected | 10k punks loading... | built by frens | powered by vibes | welcome to 404 punks" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://404punks.xyz" />
    <meta property="og:image" content="https://ipfs.io/ipfs/bafybeid4akomqdqr5ugv22gas4gm7cqgxja66omjfuomtbq64v5m7c4fkm/107.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            user-select: none;
        }

        body {
            min-height: 100vh;
            /* Win95 teal desktop */
            background: #008080;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'MS Sans Serif', 'Tahoma', Arial, sans-serif;
            padding: 16px;
        }

        /* ── Win95 Window Shell ── */
        .win95-window {
            width: 528px;
            background: #c0c0c0;
            /* classic raised border */
            border-top:    2px solid #ffffff;
            border-left:   2px solid #ffffff;
            border-right:  2px solid #808080;
            border-bottom: 2px solid #808080;
            box-shadow: 2px 2px 0 #000000;
            display: flex;
            flex-direction: column;
        }

        /* Title bar */
        .win95-titlebar {
            background: linear-gradient(to right, #000080, #1084d0);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 4px 3px 6px;
            gap: 4px;
        }
        .win95-titlebar-left {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-width: 0;
        }
        .win95-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            image-rendering: pixelated;
        }
        .win95-title {
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0;
        }
        /* Window control buttons */
        .win95-controls {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .win95-btn {
            width: 16px;
            height: 14px;
            background: #c0c0c0;
            border-top:    1px solid #ffffff;
            border-left:   1px solid #ffffff;
            border-right:  1px solid #808080;
            border-bottom: 1px solid #808080;
            font-size: 9px;
            font-weight: bold;
            color: #000000;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
            font-family: 'MS Sans Serif', Arial, sans-serif;
        }
        .win95-btn:active {
            border-top:    1px solid #808080;
            border-left:   1px solid #808080;
            border-right:  1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
        }
        .win95-btn.maximize { font-size: 8px; }

        /* Menu bar */
        .win95-menubar {
            background: #c0c0c0;
            border-bottom: 1px solid #808080;
            display: flex;
            align-items: center;
            padding: 1px 4px;
            gap: 0;
        }
        .win95-menu-item {
            font-size: 11px;
            color: #000000;
            padding: 2px 8px;
            cursor: default;
        }
        .win95-menu-item:hover {
            background: #000080;
            color: #ffffff;
        }

        /* Toolbar with AN / OG buttons */
        .win95-toolbar {
            background: #c0c0c0;
            border-bottom: 1px solid #808080;
            display: flex;
            align-items: center;
            padding: 3px 6px;
            gap: 4px;
        }
        .win95-toolbar-sep {
            width: 1px;
            height: 18px;
            background: #808080;
            border-right: 1px solid #ffffff;
            margin: 0 3px;
        }
        .win95-tool-btn {
            background: #c0c0c0;
            border-top:    1px solid #ffffff;
            border-left:   1px solid #ffffff;
            border-right:  1px solid #808080;
            border-bottom: 1px solid #808080;
            color: #000000;
            font-size: 10px;
            font-weight: bold;
            font-family: 'MS Sans Serif', Arial, sans-serif;
            padding: 2px 10px;
            cursor: pointer;
            letter-spacing: 1px;
            min-width: 36px;
            text-align: center;
        }
        .win95-tool-btn:active,
        .win95-tool-btn.active {
            border-top:    1px solid #808080;
            border-left:   1px solid #808080;
            border-right:  1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            background: #b0b0b0;
        }
        .win95-tool-btn:focus-visible { outline: 1px dotted #000; }

        /* Content area (the pixel canvas) */
        .win95-content {
            position: relative;
            /* sunken / inset look */
            border-top:    2px solid #808080;
            border-left:   2px solid #808080;
            border-right:  2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            margin: 4px 6px 4px 6px;
            overflow: hidden;
            height: 460px;
        }

        /* Status bar */
        .win95-statusbar {
            background: #c0c0c0;
            border-top: 1px solid #808080;
            display: flex;
            align-items: center;
            padding: 2px 6px;
            gap: 6px;
        }
        .win95-status-panel {
            flex: 1;
            border-top:    1px solid #808080;
            border-left:   1px solid #808080;
            border-right:  1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            font-size: 10px;
            color: #000000;
            padding: 1px 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .win95-status-panel.small {
            flex: 0 0 80px;
        }

        /* ── Pixel grid (unchanged logic) ── */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            grid-template-rows: repeat(24, 1fr);
            width: 100%;
            height: 100%;
            background: #12121f;
            image-rendering: pixelated;
        }
        .grid-container.hidden { display: none; }

        .pixel {
            background: #1f1f33;
            width: 100%;
            height: 100%;
            transition: background 0.06s ease, transform 0.08s ease;
            cursor: pointer;
            outline: 1px solid rgba(80,80,120,0.12);
            outline-offset: -1px;
            image-rendering: pixelated;
        }
        .pixel:hover {
            transform: scale(1.06);
            z-index: 2;
            outline: 1px solid rgba(255,255,255,0.4);
        }
        .pixel-clicked {
            transform: scale(0.92);
            transition: transform 0.05s;
            outline: 1px solid rgba(255,255,255,0.6);
        }
        .pixel-disabled { cursor: default !important; }
        .pixel-disabled:hover {
            transform: none !important;
            outline: 1px solid rgba(80,80,120,0.12) !important;
        }

        .original-image-container {
            display: none;
            width: 100%;
            height: 100%;
            background: #12121f;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0; left: 0;
        }
        .original-image-container.visible { display: flex; }
        .original-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
            display: block;
        }

        @media (max-width: 560px) {
            .win95-window { width: 98vw; }
            .win95-content { height: 72vw; }
            .win95-menu-item,
            .win95-status-panel { font-size: 9px; }
        }
    </style>
</head>
<body>

<div class="win95-window">

    <!-- Title Bar -->
    <div class="win95-titlebar">
        <div class="win95-titlebar-left">
            <!-- tiny pixel skull icon as inline SVG -->
            <svg class="win95-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                <rect width="16" height="16" fill="#000080"/>
                <rect x="4" y="2" width="8" height="7" fill="#c0c0c0"/>
                <rect x="3" y="4" width="10" height="5" fill="#c0c0c0"/>
                <rect x="5" y="9" width="6" height="3" fill="#c0c0c0"/>
                <rect x="5" y="12" width="2" height="2" fill="#c0c0c0"/>
                <rect x="9" y="12" width="2" height="2" fill="#c0c0c0"/>
                <rect x="5" y="4" width="2" height="3" fill="#000080"/>
                <rect x="9" y="4" width="2" height="3" fill="#000080"/>
            </svg>
            <span class="win95-title">404 Punk — 404punks.xyz</span>
        </div>
        <div class="win95-controls">
            <div class="win95-btn">_</div>
            <div class="win95-btn maximize">□</div>
            <div class="win95-btn">✕</div>
        </div>
    </div>

    <!-- Menu Bar -->
    <div class="win95-menubar">
        <span class="win95-menu-item">File</span>
        <span class="win95-menu-item">View</span>
        <span class="win95-menu-item">Punk</span>
        <span class="win95-menu-item">Help</span>
    </div>

    <!-- Toolbar -->
    <div class="win95-toolbar">
        <button class="win95-tool-btn active" id="animateBtn">AN</button>
        <button class="win95-tool-btn" id="originalBtn">OG</button>
        <div class="win95-toolbar-sep"></div>
        <span style="font-size:10px;color:#000;font-family:'MS Sans Serif',Arial,sans-serif;">404 Punk</span>
    </div>

    <!-- Canvas -->
    <div class="win95-content">
        <div class="grid-container" id="pixelGrid"></div>
        <div class="original-image-container" id="originalImageContainer">
            <img id="originalImage" src="" alt="404 Punk Original">
        </div>
    </div>

    <!-- Status Bar -->
    <div class="win95-statusbar">
        <div class="win95-status-panel" id="statusText">Ready</div>
        <div class="win95-status-panel small">404punks.xyz</div>
    </div>

</div>

<script>
(function () {
    // ---------- CONFIG ----------
    const AN_BASE = 'https://ipfs.io/ipfs/bafybeid4akomqdqr5ugv22gas4gm7cqgxja66omjfuomtbq64v5m7c4fkm';
    const OG_BASE = 'https://ipfs.io/ipfs/bafybeid4akomqdqr5ugv22gas4gm7cqgxja66omjfuomtbq64v5m7c4fkm';

    // ---------- TOKEN ID ----------
    let TOKEN_ID = 107;
    try {
        const params = new URLSearchParams(window.location.search);
        const idParam = params.get('id') || params.get('tokenId') || params.get('token');
        if (idParam) {
            const parsed = parseInt(idParam, 10);
            if (!isNaN(parsed) && parsed > 0) TOKEN_ID = parsed;
        } else {
            const num = parseInt(window.location.pathname.split('/').pop(), 10);
            if (!isNaN(num) && num > 0) TOKEN_ID = num;
        }
    } catch (_) {}

    // ---------- PALETTE ----------
    const PALETTE = [
        "#000000","#FFFFFF","#FF0000","#00FF00","#0000FF",
        "#FFFF00","#00FFFF","#FF00FF","#C0C0C0","#808080",
        "#800000","#808000","#008000","#800080","#008080",
        "#000080","#FFA500","#A52A2A","#8B4513","#2F4F4F",
        "#556B2F","#D2691E","#FF7F50","#6495ED","#DC143C",
        "#00FFFF","#00008B","#008B8B","#B8860B","#A9A9A9",
        "#006400","#BDB76B","#8B008B","#556B2F","#FF8C00",
        "#9932CC","#8B0000","#E9967A","#8FBC8F","#483D8B",
        "#2F4F4F","#00CED1","#9400D3","#FF1493","#00BFFF",
        "#696969","#1E90FF","#B22222","#FFFAF0","#228B22",
        "#FF00FF","#DCDCDC","#F8F8FF","#FFD700","#DAA520",
        "#808080","#008000","#ADFF2F","#F0FFF0","#FF69B4",
        "#CD5C5C","#4B0082","#F0E68C","#E6E6FA","#FFF0F5",
        "#7CFC00","#FFFACD","#ADD8E6","#F08080","#E0FFFF",
        "#FAFAD2","#D3D3D3","#90EE90","#FFB6C1","#FFA07A",
        "#20B2AA","#87CEFA","#8470FF","#778899","#B0C4DE",
        "#FFFFE0","#00FF7F","#F5DEB3","#FFE4B5","#FFDEAD",
        "#F5F5DC","#FDF5E6","#FFE4E1","#FAF0E6","#F0F8FF",
        "#F5F5F5","#FFF8DC","#FFEBCD","#FFEFD5","#FFDAB9",
        "#CD853F","#D2691E","#8B4513","#A0522D","#A52A2A",
        "#800000","#FF4500","#FF6347","#FF7F50","#FF8C00",
        "#FFA500","#FFD700","#DAA520","#B8860B","#CD853F",
        "#D2691E","#8B4513","#A0522D","#A52A2A","#800000"
    ];

    const GRID_SIZE = 24;
    const TOTAL = GRID_SIZE * GRID_SIZE;

    const gridEl        = document.getElementById('pixelGrid');
    const originalContainer = document.getElementById('originalImageContainer');
    const originalImg   = document.getElementById('originalImage');
    const animateBtn    = document.getElementById('animateBtn');
    const originalBtn   = document.getElementById('originalBtn');
    const statusText    = document.getElementById('statusText');

    let pixelColorSet    = [];
    let currentColorIndex = new Int8Array(TOTAL);
    let pixelElements    = [];
    let isOriginalMode   = false;
    let imageLoaded      = false;

    function setStatus(msg) { statusText.textContent = msg; }

    // ---------- UTILS ----------
    function randInt(max) { return Math.floor(Math.random() * max); }

    function rgbToHex(r, g, b) {
        return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1).toUpperCase();
    }
    function hexToRgb(hex) {
        const n = parseInt(hex.replace('#', ''), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function closestPaletteIndex(hex) {
        const [r, g, b] = hexToRgb(hex);
        let min = Infinity, idx = 0;
        for (let i = 0; i < PALETTE.length; i++) {
            const [pr, pg, pb] = hexToRgb(PALETTE[i]);
            const d = (r-pr)**2 + (g-pg)**2 + (b-pb)**2;
            if (d < min) { min = d; idx = i; if (d === 0) break; }
        }
        return idx;
    }

    // ---------- GRID ----------
    function buildGrid() {
        const frag = document.createDocumentFragment();
        pixelElements = []; pixelColorSet = [];
        currentColorIndex.fill(0);
        for (let i = 0; i < TOTAL; i++) {
            const set = new Set();
            while (set.size < 4) set.add(randInt(PALETTE.length));
            const arr = Array.from(set);
            pixelColorSet.push(arr);
            const px = document.createElement('div');
            px.className = 'pixel';
            px.dataset.index = i;
            px.style.backgroundColor = PALETTE[arr[0]];
            frag.appendChild(px);
            pixelElements.push(px);
        }
        gridEl.appendChild(frag);

        gridEl.addEventListener('click', function (e) {
            if (isOriginalMode) return;
            const px = e.target;
            if (!px.classList.contains('pixel') || px.classList.contains('pixel-disabled')) return;
            const i = parseInt(px.dataset.index, 10);
            const ni = (currentColorIndex[i] + 1) % 4;
            currentColorIndex[i] = ni;
            px.style.backgroundColor = PALETTE[pixelColorSet[i][ni]];
            px.classList.add('pixel-clicked');
            setTimeout(() => px.classList.remove('pixel-clicked'), 150);
            setStatus('Pixel ' + i + ' recolored — ' + PALETTE[pixelColorSet[i][ni]]);
        });
    }

    function loadImageToGrid(url, cb) {
        setStatus('Loading punk #' + TOKEN_ID + '...');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
            const canvas = document.createElement('canvas');
            canvas.width = GRID_SIZE; canvas.height = GRID_SIZE;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img, 0, 0, GRID_SIZE, GRID_SIZE);
            const data = ctx.getImageData(0, 0, GRID_SIZE, GRID_SIZE).data;
            for (let i = 0; i < TOTAL; i++) {
                const o = i * 4;
                const mainIdx = closestPaletteIndex(rgbToHex(data[o], data[o+1], data[o+2]));
                const set = new Set([mainIdx]);
                while (set.size < 4) set.add(randInt(PALETTE.length));
                const arr = Array.from(set);
                const pos = arr.indexOf(mainIdx);
                if (pos > 0) { arr[pos] = arr[0]; arr[0] = mainIdx; }
                pixelColorSet[i] = arr;
                currentColorIndex[i] = 0;
                pixelElements[i].style.backgroundColor = PALETTE[mainIdx];
            }
            imageLoaded = true;
            if (cb) cb();
        };
        img.onerror = function () {
            console.warn('404 Punk: image load failed —', url);
            setStatus('Error loading punk #' + TOKEN_ID);
            imageLoaded = true;
            if (cb) cb();
        };
        img.src = url;
    }

    // ---------- MODE SWITCH ----------
    function setANMode() {
        if (!imageLoaded) return;
        isOriginalMode = false;
        animateBtn.classList.add('active');
        originalBtn.classList.remove('active');
        gridEl.classList.remove('hidden');
        originalContainer.classList.remove('visible');
        pixelElements.forEach(el => { el.classList.remove('pixel-disabled'); el.style.cursor = 'pointer'; });
        setStatus('AN mode — click pixels to recolor | Punk #' + TOKEN_ID);
    }
    function setOGMode() {
        if (!imageLoaded) return;
        isOriginalMode = true;
        originalBtn.classList.add('active');
        animateBtn.classList.remove('active');
        gridEl.classList.add('hidden');
        originalContainer.classList.add('visible');
        originalImg.src = OG_BASE + '/' + TOKEN_ID + '.png';
        pixelElements.forEach(el => { el.classList.add('pixel-disabled'); el.style.cursor = 'default'; });
        setStatus('OG mode — original art | Punk #' + TOKEN_ID);
    }

    // ---------- INIT ----------
    buildGrid();
    loadImageToGrid(AN_BASE + '/' + TOKEN_ID + '.png', setANMode);
    animateBtn.addEventListener('click', setANMode);
    originalBtn.addEventListener('click', setOGMode);
})();
</script>
</body>
</html>
